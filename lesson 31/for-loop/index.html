<body>
    <h1>The <code>for</code> loop</h1>
    <p><code>For (statement1 ; statement2 ; statement3) {...}  </code></p>
    <ul>
        <l1><b>Statmenent1</b> - runs once before the loop starts &nbsp;(<code>i = 0</code>)</l1>
        <l1><b>statement2</b> - the condition, checked before every pass &nbsp;(<code>1 &lt; 5</code>)</l1>
        <l1><b>statement3</b> - runs after every pass &nbsp;(<code>i++</code>)</l1>
    </ul>
