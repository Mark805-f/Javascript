<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #square {
            width: 50px;
            height: 50px;
            background: #0f3460;
        }

        .testing {
            position: relative;
            left: 0;
            opacity: 1;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <button id="growBtn">Grow the square</button>
    <div id="square"></div>

    <button id="moveBtn">Animate the text</button>
    <p class="testing">Watch me move, fade and shrink</p>

    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script src="main.js"></script>
</body>
</html>
