    <h2>REgular Expressions - the <code>match()</code> method</h2>
    <p><code>match()</code> returns an <b>array</b> of every part of the text that fits the pattern. The <code>/g</code> flag ("global") means <b>find them all</b>, not just the first.</p>

    <p>Text: <i>"My school is the best school"</i> &nbsp; Pattern: <code>/school/g</code></p>
    <p>Result: <b id="result5"></b></p>
