    <h2>Regular Expressions - <code>search()</code>method</h2>
    <p><code>search()</code> looks for a piece of text and returns the <b>position</b> where is starts (or <code>-1</code> if not found)</p>
    <p>Text: <i>"The best school in the world is Digital School!"</i></p>
    <p>Position found with a string <b class="res" id="result1"></b></p>
    <p>Position found with a regex &nbsp;<code>/Digital School</code>: <b class="res" id="result2"></b></p>
